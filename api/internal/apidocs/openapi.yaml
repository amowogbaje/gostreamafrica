# GENERATED ONCE, THEN EDITED BY HAND: this file is the source of truth.
# api/internal/contract fails CI when handlers and this file disagree.
openapi: 3.0.3
info:
  title: StreamAfrica API
  version: 0.4.0
  description: 'StreamAfrica HTTP API.


    **Try it from this page**

    1. Call **POST /v1/auth/register** (or **/v1/auth/login** if you already have an account). Copy `access_token`
    from the response.

    2. Click **Authorize** (top right), paste the token (no `Bearer ` prefix) and confirm.

    3. Call anything marked with a padlock. Access tokens last 15 minutes: log in again when you see `token_expired`.


    The browser keeps the refresh cookie for you, so **POST /v1/auth/refresh** works from this page. Verification
    and reset emails land in Mailpit (http://localhost:8025) in local development.


    This file is the contract: `api/internal/contract` fails CI when a handler and this file disagree.'
servers:
- url: http://localhost:8088/api
  description: through nginx (local)
- url: http://localhost:8080
  description: direct to the API (local)
tags:
- name: health
- name: auth
- name: me
- name: catalog
- name: library
- name: creator
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Liveness
      operationId: healthz
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - health
      summary: 'Readiness: Postgres, Redis and object storage reachable'
      operationId: readyz
      responses:
        '200':
          description: all dependencies reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: at least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Create an account (role viewer), send the verification email and sign in
      operationId: register
      description: 'Rate limited: 5 per hour per IP. Web clients get the refresh token as an HttpOnly cookie; send
        X-Auth-Transport: body to receive it in the response body.'
      parameters:
      - name: X-Auth-Transport
        in: header
        required: false
        schema:
          type: string
          enum:
          - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: created
          headers: &id008
            Set-Cookie:
              schema:
                type: string
              description: sa_refresh=...; HttpOnly; SameSite=Strict (web clients only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered (email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': &id006
          description: Malformed JSON or unknown field (invalid_json)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id002
          description: Body larger than 8 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id003
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id007
          description: Validation failed; error.fields names the fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id004
          description: Rate limited
          headers: &id001
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id005
          description: Rate limiter or lockout store unavailable (fails closed)
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/verify-email:
    post:
      tags:
      - auth
      summary: Confirm an email address with the emailed single-use token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: verified
        '400':
          description: Invalid or expired token, or malformed JSON (invalid_or_expired_token, invalid_json)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': *id002
        '415': *id003
        '429': *id004
        '503': *id005
  /v1/auth/resend-verification:
    post:
      tags:
      - auth
      summary: Send a fresh verification link (same answer whether or not the account exists)
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400': *id006
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
        '503': *id005
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in
      operationId: login
      description: Wrong password and unknown email return the same 401. After repeated failures the account/IP
        pair is locked with exponential backoff (429 with Retry-After).
      parameters:
      - name: X-Auth-Transport
        in: header
        required: false
        schema:
          type: string
          enum:
          - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: signed in
          headers: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password (invalid_credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account suspended (account_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id006
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
        '503': *id005
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for new tokens (the old refresh token stops working)
      operationId: refresh
      description: Reads the refresh token from the sa_refresh cookie (web) or from the JSON body (mobile). Presenting
        an already-used refresh token revokes its whole family.
      parameters:
      - name: sa_refresh
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: new tokens
          headers: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid, expired or reused refresh token (invalid_refresh_token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie request from an origin that is not allowed (forbidden_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id006
        '413': *id002
        '415': *id003
        '429': *id004
        '503': *id005
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: End the session of the presented refresh token (idempotent)
      operationId: logout
      parameters:
      - name: sa_refresh
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: signed out
        '403':
          description: Origin not allowed (forbidden_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id006
        '413': *id002
        '415': *id003
  /v1/auth/logout-all:
    post:
      tags:
      - auth
      summary: End every session of the signed-in user
      operationId: logoutAll
      security: &id009
      - bearerAuth: []
      responses:
        '204':
          description: all sessions ended
        '401': &id010
          description: Not signed in, or the access token is invalid or expired (codes unauthenticated, invalid_token,
            token_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Email a password-reset link (same answer whether or not the account exists)
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400': *id006
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
        '503': *id005
  /v1/auth/reset-password:
    post:
      tags:
      - auth
      summary: Set a new password with a single-use token and sign out everywhere
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: password changed
        '400':
          description: Invalid or expired token, or malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
        '503': *id005
  /v1/me:
    get:
      tags:
      - me
      summary: The signed-in user and profile
      operationId: getMe
      security: *id009
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': *id010
    patch:
      tags:
      - me
      summary: Update the profile (role, status and email cannot be changed here)
      operationId: patchMe
      security: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': *id010
        '400': *id006
        '413': *id002
        '415': *id003
        '422': *id007
  /v1/titles:
    get:
      tags:
      - catalog
      summary: List titles (cursor pagination)
      operationId: listTitles
      security: &id012
      - {}
      - bearerAuth: []
      description: Anonymous visitors and viewers see published titles; creators also see their own titles in any
        state; admins see all.
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - movie
          - series
      - name: genre
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 60
        description: Genre slug, see GET /v1/genres
      - name: language
        in: query
        schema:
          type: string
          pattern: ^[a-z]{2,3}$
        description: Original language code (en, yo, ig, ha, pcm, ...)
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Search text. Accent-insensitive; matches names (weighted higher) and synopses.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - name
          - relevance
        description: Default newest, or relevance when q is given. relevance needs q.
      - &id015
        name: cursor
        in: query
        schema:
          type: string
          maxLength: 600
        description: Opaque cursor from next_cursor of the previous page
      - &id016
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - &id013
        name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: a page of titles
          headers: &id011
            ETag:
              schema:
                type: string
              description: Strong ETag of the body. Send it back in If-None-Match to receive 304.
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '304': &id014
          description: 'Not modified: the client''s cached copy is current'
          headers: *id011
        '400':
          description: Cursor does not belong to this request (invalid_cursor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id010
        '422':
          description: Invalid query parameter; error.fields names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/titles/{slug}:
    get:
      tags:
      - catalog
      summary: 'Title detail: genres, cast and crew, subtitles, seasons and episodes'
      operationId: getTitle
      security: *id012
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 120
      - *id013
      responses:
        '200':
          description: the title
          headers: *id011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        '304': *id014
        '401': *id010
        '404':
          description: No such title, or not visible to this viewer (title_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/genres:
    get:
      tags:
      - catalog
      summary: All genres with their number of published titles
      operationId: listGenres
      description: Cached in Redis (invalidated when titles change) and for 5 minutes by clients and the CDN.
      parameters:
      - *id013
      responses:
        '200':
          description: genres
          headers: *id011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
        '304': *id014
  /v1/home:
    get:
      tags:
      - catalog
      summary: 'Home page rows: Trending Now, New Releases, one row per language, and Continue Watching when signed
        in'
      operationId: getHome
      security: *id012
      parameters:
      - *id013
      responses:
        '200':
          description: home rows
          headers: *id011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '304': *id014
        '401': *id010
  /v1/me/watchlist:
    get:
      tags:
      - library
      summary: The signed-in user's watchlist, newest first
      operationId: listWatchlist
      security: *id009
      parameters:
      - *id015
      - *id016
      responses:
        '200':
          description: a page of the watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistPage'
        '400':
          description: Invalid cursor (invalid_cursor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id010
        '422':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - library
      summary: 'Add a title (idempotent: 201 when added, 200 when already there)'
      operationId: addToWatchlist
      security: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistAddRequest'
      responses:
        '200':
          description: already on the watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistAdd'
        '201':
          description: added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistAdd'
        '401': *id010
        '404':
          description: Title not found or not visible (title_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Watchlist is full, 500 titles (watchlist_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id006
        '413': *id002
        '415': *id003
        '422': *id007
  /v1/me/watchlist/{title_id}:
    delete:
      tags:
      - library
      summary: Remove a title (idempotent)
      operationId: removeFromWatchlist
      security: *id009
      parameters:
      - name: title_id
        in: path
        required: true
        schema: &id017
          type: string
          format: uuid
      responses:
        '204':
          description: removed (or was not there)
        '401': *id010
        '422':
          description: title_id is not a UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me/progress:
    put:
      tags:
      - library
      summary: Save playback position (idempotent, throttled to 30 requests per minute per user)
      operationId: putProgress
      security: *id009
      description: Marks the item completed at 95% of the duration. A position beyond the duration is clamped. Repeating
        the same values changes nothing. Movies must omit episode_id; series require it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '200':
          description: stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '401': *id010
        '404':
          description: Title not found or not visible (title_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (including episode_id missing, not allowed, or from another title)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Throttled
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400': *id006
        '413': *id002
        '415': *id003
        '503': *id005
  /v1/me/continue-watching:
    get:
      tags:
      - library
      summary: Unfinished titles, most recently watched first (a series appears once, at the episode watched last)
      operationId: continueWatching
      security: *id009
      parameters:
      - *id016
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinueList'
        '401': *id010
        '422':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/uploads:
    post:
      tags:
      - creator
      summary: Start a resumable upload of a movie's video file (creators and admins)
      description: 'Opens a multipart upload in object storage and returns presigned URLs for the first parts. The
        video bytes never pass through this API: send each part with PUT straight to its URL, sending exactly the
        `size_bytes` given for that part. URLs expire (see `urls_expire_at`); ask for fresh ones with
        **POST /v1/creator/uploads/{id}/parts**. When every part is stored call **POST /v1/creator/uploads/{id}/complete**.
        Limits: file size, unfinished uploads per creator and bytes per day are enforced here.'
      operationId: createUpload
      security: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: upload started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreated'
        '400': *id006
        '401': *id010
        '403':
          description: Not a creator or admin (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such title, or it is not yours (title_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The title already has a video (video_exists) or an unfinished upload (upload_in_progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
        '502':
          description: Object storage is unavailable (storage_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - creator
      summary: An upload's state; while unfinished, also which parts are already stored (use it to resume)
      operationId: getUpload
      security: *id009
      responses:
        '200':
          description: the upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401': *id010
        '403':
          description: Not a creator or admin (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such upload, or it is not yours (upload_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Object storage is unavailable (storage_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - creator
      summary: Cancel an unfinished upload and free its storage (cancelling twice is fine)
      operationId: cancelUpload
      security: *id009
      responses:
        '204':
          description: cancelled
        '401': *id010
        '403':
          description: Not a creator or admin (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such upload, or it is not yours (upload_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already completed, so it can no longer be cancelled (upload_not_cancellable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Object storage is unavailable (storage_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/creator/uploads/{id}/parts:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - creator
      summary: Fresh presigned URLs for specific parts (at most 20 per call)
      operationId: presignUploadParts
      security: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartsRequest'
      responses:
        '200':
          description: presigned URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartsResponse'
        '400': *id006
        '401': *id010
        '403':
          description: Not a creator or admin (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such upload, or it is not yours (upload_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The upload no longer accepts parts (upload_not_open) or has expired (upload_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': *id002
        '415': *id003
        '422': *id007
        '429': *id004
  /v1/creator/uploads/{id}/complete:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - creator
      summary: Finish the upload, check the file and queue it for processing (safe to call again)
      description: 'Checks that every part is stored with its exact size, assembles the file, verifies its size and
        container signature, scans it, then queues a transcode job. A file that is refused ends the upload (422 with
        the reason as `code`: size_mismatch, unsupported_container, container_mismatch, malware_detected). Missing
        or wrong-sized parts give 422 upload_incomplete: send them, then call again. Codec, duration and resolution
        are checked later by the worker; a refusal there shows up on **GET /v1/creator/uploads/{id}**.'
      operationId: completeUpload
      security: *id009
      responses:
        '202':
          description: accepted; the job is queued and processing continues in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '401': *id010
        '403':
          description: Not a creator or admin (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such upload, or it is not yours (upload_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The upload was rejected (upload_rejected), cancelled or expired (upload_closed, upload_expired), or its stored data is gone (upload_incomplete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parts missing or wrong size (upload_incomplete), or the file was refused (size_mismatch, unsupported_container, container_mismatch, malware_detected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': *id004
        '502':
          description: Object storage is unavailable (storage_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id005
