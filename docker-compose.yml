name: streamafrica

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR}:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "${BIND_ADDR}:${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  seaweedfs:
    # Local S3-compatible object store (replaces MinIO, see docs/adr/0014). One container runs
    # master + volume + filer + S3 gateway. Local only: staging/production use R2 or S3.
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.51}
    # The wrapper renders the S3 identities file from env, then runs the image's own entrypoint.
    entrypoint: ["/bin/sh", "/seaweedfs/entrypoint.sh"]
    command:
      - server
      - -s3
      - -s3.config=/tmp/s3.json
      - -s3.allowedOrigins=${S3_ALLOWED_ORIGINS}
      - -volume.max=30
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/entrypoint.sh:/seaweedfs/entrypoint.sh:ro
      - ./infra/seaweedfs/master.toml:/etc/seaweedfs/master.toml:ro
    ports:
      # Only the S3 API is published. The filer (8888) and master (9333) ports accept
      # unauthenticated writes, so they stay inside the Docker network.
      - "${BIND_ADDR}:${S3_HOST_PORT}:8333"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8333/status >/dev/null && curl -fsS http://127.0.0.1:8888/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *logging

  storage-init:
    # One-shot: creates the buckets over the S3 API. Same image as seaweedfs (it has curl).
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.51}
    entrypoint: ["/bin/sh", "/scripts/storage-init.sh"]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - ./infra/scripts/storage-init.sh:/scripts/storage-init.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.21.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${BIND_ADDR}:${MAILPIT_UI_HOST_PORT}:8025"
      - "${BIND_ADDR}:${MAILPIT_SMTP_HOST_PORT}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      API_HTTP_ADDR: ":8080"
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # --- object storage (plain S3 API, see docs/adr/0006 and 0014)
      S3_ENDPOINT: http://seaweedfs:8333
      # Host the BROWSER uses. Presigned URLs are signed for this host, so it must match.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "true"
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      # signed media URLs (docs/playback.md): the same key is given to nginx, which checks every request
      PLAYBACK_SIGNING_KEY: ${PLAYBACK_SIGNING_KEY}
      PLAYBACK_BASE_URL: ${PLAYBACK_BASE_URL}
      PLAYBACK_TOKEN_TTL_HOURS: ${PLAYBACK_TOKEN_TTL_HOURS:-4}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-8589934592}
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-67108864}
      UPLOAD_MAX_ACTIVE_PER_CREATOR: ${UPLOAD_MAX_ACTIVE_PER_CREATOR:-3}
      UPLOAD_DAILY_BYTES_PER_CREATOR: ${UPLOAD_DAILY_BYTES_PER_CREATOR:-34359738368}
      # nginx is the one proxy in front of the API locally: trust exactly one X-Forwarded-For hop
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # --- auth (see docs/security-auth.md)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_ACCESS_TTL_MINUTES: ${AUTH_ACCESS_TTL_MINUTES:-15}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-30}
      AUTH_REFRESH_ABSOLUTE_DAYS: ${AUTH_REFRESH_ABSOLUTE_DAYS:-90}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/v1/auth}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8088}
      AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-19456}
      AUTH_ARGON2_TIME: ${AUTH_ARGON2_TIME:-2}
      AUTH_ARGON2_PARALLELISM: ${AUTH_ARGON2_PARALLELISM:-1}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8088}
      # --- email (Mailpit locally)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: "${SMTP_FROM:-StreamAfrica <no-reply@streamafrica.local>}"
      # --- catalog cache
      CATALOG_HOME_TTL_SECONDS: ${CATALOG_HOME_TTL_SECONDS:-300}
      CATALOG_GENRES_TTL_SECONDS: ${CATALOG_GENRES_TTL_SECONDS:-600}
      # --- tests run inside this container (make test): integration tests use throwaway schemas,
      # never your data, and the OpenAPI contract test reads the mounted spec
      TEST_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      TEST_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      OPENAPI_SPEC: /docs/openapi.yaml
      # the real-storage test of the S3 client (it cleans up after itself); REQUIRE_INTEGRATION makes a missing service fail
      TEST_S3_ENDPOINT: http://seaweedfs:8333
      TEST_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      TEST_S3_SECRET_KEY: ${S3_SECRET_KEY}
      REQUIRE_INTEGRATION: "1"
    volumes:
      - ./api:/app
      - ./docs:/docs:ro
      - gomod_cache:/go/pkg/mod
      - api_gobuild:/root/.cache/go-build
    ports:
      - "${BIND_ADDR}:${API_HOST_PORT}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    logging: *logging

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      WORKER_HEALTH_ADDR: ":8081"
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_FFMPEG_THREADS: ${WORKER_FFMPEG_THREADS:-2}
      WORKER_X264_PRESET: ${WORKER_X264_PRESET:-veryfast}
      WORKER_TEMP_DIR: /scratch
      # tests run inside this container (make test): throwaway database schemas and test objects, never your data
      TEST_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      TEST_S3_ENDPOINT: http://seaweedfs:8333
      TEST_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      TEST_S3_SECRET_KEY: ${S3_SECRET_KEY}
      REQUIRE_INTEGRATION: "1"
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "true"
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - ./worker:/app
      - ./api/migrations:/api/migrations:ro   # the worker's database tests apply the API's migrations
      - gomod_cache:/go/pkg/mod
      - worker_gobuild:/root/.cache/go-build
      - worker_scratch:/scratch
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    logging: *logging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      WATCHPACK_POLLING: "true"
      NODE_OPTIONS: "--max-old-space-size=1536"
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${BIND_ADDR}:${WEB_HOST_PORT}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    logging: *logging

  nginx:
    image: nginx:1.27.2-alpine
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      PLAYBACK_SIGNING_KEY: ${PLAYBACK_SIGNING_KEY}
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${BIND_ADDR}:${NGINX_HOST_PORT}:80"
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot tool, only runs via `make migrate-up` / `make migrate-down`.
  migrate:
    profiles: ["tools"]
    image: migrate/migrate:v4.18.1
    entrypoint: ["sh", "-c", 'exec migrate -path=/migrations -database "$$DATABASE_URL" "$$@"', "migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    volumes:
      - ./api/migrations:/migrations
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot tool, only runs via `make s3-check`: proves the object store supports everything
  # Phase 2 needs (multipart, presigned URLs, CORS, anonymous rules, ranges).
  s3check:
    profiles: ["tools"]
    image: python:3.12-slim
    entrypoint: ["sh", "-c", 'pip install -q --disable-pip-version-check --no-cache-dir boto3==1.43.123 requests==2.33.1 && exec python /scripts/s3_compat.py "$$@"', "s3check"]
    environment:
      PIP_ROOT_USER_ACTION: ignore
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOWED_ORIGINS: ${S3_ALLOWED_ORIGINS}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      CLEAN_PREFIX: ${CLEAN_PREFIX:-_s3check/}
    volumes:
      - ./infra/scripts/s3_compat.py:/scripts/s3_compat.py:ro
    depends_on:
      seaweedfs: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  seaweeddata:
  worker_scratch:
  gomod_cache:
  api_gobuild:
  worker_gobuild:
  web_node_modules:
