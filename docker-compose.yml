name: streamafrica

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR}:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "${BIND_ADDR}:${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  minio:
    # MinIO removed its images from Docker Hub and Quay (Sept 2026). See docs/adr/0003.
    image: ${MINIO_IMAGE:-scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z}
    platform: linux/amd64
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "${BIND_ADDR}:${MINIO_API_HOST_PORT}:9000"
      - "${BIND_ADDR}:${MINIO_CONSOLE_HOST_PORT}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging

  minio-init:
    image: ${MC_IMAGE:-scnd/mc-mirror:RELEASE.2025-02-04T04-57-50Z}
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - ./infra/scripts/minio-init.sh:/scripts/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.21.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${BIND_ADDR}:${MAILPIT_UI_HOST_PORT}:8025"
      - "${BIND_ADDR}:${MAILPIT_SMTP_HOST_PORT}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      API_HTTP_ADDR: ":8080"
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5433/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./api:/app
      - gomod_cache:/go/pkg/mod
      - api_gobuild:/root/.cache/go-build
    ports:
      - "${BIND_ADDR}:${API_HOST_PORT}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    logging: *logging

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      WORKER_HEALTH_ADDR: ":8081"
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL}
    volumes:
      - ./worker:/app
      - gomod_cache:/go/pkg/mod
      - worker_gobuild:/root/.cache/go-build
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    logging: *logging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      WATCHPACK_POLLING: "true"
      NODE_OPTIONS: "--max-old-space-size=1536"
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${BIND_ADDR}:${WEB_HOST_PORT}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    logging: *logging

  nginx:
    image: nginx:1.27.2-alpine
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${BIND_ADDR}:${NGINX_HOST_PORT}:80"
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot tool, only runs via `make migrate-up` / `make migrate-down`.
  migrate:
    profiles: ["tools"]
    image: migrate/migrate:v4.18.1
    entrypoint: ["sh", "-c", 'exec migrate -path=/migrations -database "$$DATABASE_URL" "$$@"', "migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    volumes:
      - ./api/migrations:/migrations
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  gomod_cache:
  api_gobuild:
  worker_gobuild:
  web_node_modules:
