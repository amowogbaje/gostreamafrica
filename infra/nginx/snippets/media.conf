# Shared settings for locations that proxy object storage (HLS, public assets).
if ($request_method = OPTIONS) {
    include /etc/nginx/snippets/cors.conf;
    return 204;
}
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

include /etc/nginx/snippets/cors.conf;
add_header Cache-Control $media_cache_control always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host minio:9000;
# Range requests are forwarded untouched so MinIO answers 206 Partial Content.
proxy_set_header Range    $http_range;
proxy_set_header If-Range $http_if_range;

# Strip upstream headers we replace or don't want to leak.
proxy_hide_header Cache-Control;
proxy_hide_header Server;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
