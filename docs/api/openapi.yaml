openapi: 3.0.3
info: { title: StreamAfrica API, version: 0.1.0 }
servers:
  - url: http://localhost:8088/api
    description: via nginx (local)
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200": { description: ok }
  /readyz:
    get:
      summary: Readiness (postgres, redis, s3)
      responses:
        "200": { description: all dependencies reachable }
        "503": { description: at least one dependency unreachable }
  /v1/auth/register:
    post:
      summary: Create an account and sign in (sets the sa_session cookie)
      description: Rate limited to 5 per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "400": { description: malformed JSON or unknown field }
        "409": { description: email already registered (code email_taken) }
        "413": { description: body larger than 8 KB }
        "415": { description: Content-Type is not application/json }
        "422": { description: validation failed, see error.fields }
        "429": { description: rate limited, see Retry-After }
        "503": { description: rate limiter unavailable }
  /v1/auth/login:
    post:
      summary: Sign in (sets the sa_session cookie)
      description: Rate limited to 20 per 10 minutes per IP and 10 per 15 minutes per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: signed in, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "401": { description: wrong email or password (code invalid_credentials, same for both) }
        "422": { description: missing fields }
        "429": { description: rate limited, see Retry-After }
        "503": { description: rate limiter unavailable }
  /v1/auth/logout:
    post:
      summary: End the session and clear the cookie (idempotent)
      responses:
        "204": { description: signed out }
  /v1/auth/me:
    get:
      summary: The signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } }, description: ok }
        "401": { description: not signed in }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sa_session }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128, description: "10+ characters, at most 128 bytes" }
        name: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [viewer, creator, admin] }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      properties: { user: { $ref: "#/components/schemas/User" } }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
