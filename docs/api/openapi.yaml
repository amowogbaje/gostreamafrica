openapi: 3.0.3
info: { title: StreamAfrica API, version: 0.0.1 }
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
  /readyz:
    get:
      summary: Readiness (postgres, redis, s3)
      responses:
        "200": { description: all dependencies reachable }
        "503": { description: at least one dependency unreachable }
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, request_id: { type: string } }
